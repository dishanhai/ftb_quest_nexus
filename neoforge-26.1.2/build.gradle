// Author: dishanhai
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.dishanhai'
version = mod_version
base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories {
    mavenCentral()
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}

def previousJava = fileTree('../neoforge/src/main/java') {
    // The 1.21.1 annotation-based GameTests need porting to the 26.1 test registry.
    exclude '**/*GameTests.java'
    exclude { details -> file('src/main/java/' + details.path).isFile() }
}
def sharedJava = fileTree('../src/main/java') {
    include 'com/dishanhai/ftb_quest_nexus/api/ftbq/**'
    include 'com/dishanhai/ftb_quest_nexus/api/BindingTransfer.java'
    include 'com/dishanhai/ftb_quest_nexus/client/FtbqChoiceRewardScreen.java'
    include 'com/dishanhai/ftb_quest_nexus/client/FtbqSubmitterSelectionClient.java'
    include 'com/dishanhai/ftb_quest_nexus/client/HeaderButtonLayout.java'
    include 'com/dishanhai/ftb_quest_nexus/client/NexusIcons.java'
    include 'com/dishanhai/ftb_quest_nexus/client/BlockScreenTheme.java'
    include 'com/dishanhai/ftb_quest_nexus/client/NexusConfigScreen.java'
    include 'com/dishanhai/ftb_quest_nexus/client/glass/GlassUiPolicy.java'
    include 'com/dishanhai/ftb_quest_nexus/config/NexusConfigCommands.java'
    include 'com/dishanhai/ftb_quest_nexus/config/ServerOption.java'
    exclude { details -> file('src/main/java/' + details.path).isFile() }
}
sourceSets.test.java.srcDir '../src/test/java'
sourceSets.test.java.exclude '**/ForgeQuestGlassMixinContractTest.java'
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.named('compileJava') { source previousJava, sharedJava }
tasks.named('sourcesJar') { from previousJava, sharedJava }

def shBetterUiJar = file(findProperty('shBetterUiJar') ?: "../../SH-Better-UI/neoforge-26.1.2/build/libs/sh_better_ui-neoforge-${minecraft_version}-${sh_better_ui_version}.jar")
def chemicalMods = files('libs/mekanism-version-locked-1713956-9267959.jar', 'libs/applied-mekanistics-version-locked-1742374-9153209.jar')

tasks.named('compileJava') {
    doFirst {
        if (!shBetterUiJar.isFile()) {
            throw new GradleException('Build the Minecraft 26.1.2 SH-Better-UI client API, or set -PshBetterUiJar=<26.1.2-jar>.')
        }
    }
}
dependencies {
    implementation files('libs/appliedenergistics2-26.1.12-beta.jar',
            'libs/ftb-quests-neoforge-26.1.2.10.jar',
            'libs/ftb-library-neoforge-26.1.2.12.jar',
            'libs/ftb-teams-neoforge-26.1.2.5.jar',
            'libs/guideme-26.1.17-beta.jar')
    implementation files(shBetterUiJar)
    compileOnly files('libs/Jade-mc26.1-NeoForge-26.1.12.jar')
    compileOnly chemicalMods
    // FTB Library bundles JSON5 as a runtime Jar-in-Jar; its quest serializers expose it at compile time.
    compileOnly files(zipTree(file('libs/ftb-library-neoforge-26.1.2.12.jar')).matching { include 'META-INF/jarjar/json5-java-3.0.0.jar' }.files)
    if (providers.gradleProperty('mekanismRuntime').isPresent()) runtimeOnly chemicalMods
    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            programArguments.addAll('--tests', "${mod_id}:*")
        }
        configureEach {
            gameDirectory = file('run')
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods { ftb_quest_nexus { sourceSet sourceSets.main } }
}

processResources {
    from('../src/main/resources') {
        include 'assets/**', 'ftb-quest-nexus-icon.png'
        exclude 'assets/**/models/item/*.json'
    }
    from(fileTree('../neoforge/src/main/resources') {
        exclude { details -> file('src/main/resources/' + details.path).isFile() }
    })
    from('../src/main/resources/data/ftb_quest_nexus/structures') { into 'data/ftb_quest_nexus/structure' }
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                 mod_authors: mod_authors, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
    filesMatching('assets/**/models/**/*.json') { filter { line -> line.replace('"forge_data"', '"neoforge_data"') } }
}

jar {
    exclude '**/*GameTests*.class', 'data/ftb_quest_nexus/structure/empty.nbt', 'data/ftb_quest_nexus/test_instance/**'
    manifest.attributes('Specification-Title': mod_name, 'Specification-Vendor': mod_authors,
            'Specification-Version': '1', 'Implementation-Title': mod_name,
            'Implementation-Version': project.version, 'Implementation-Vendor': mod_authors)
}

tasks.register('verifyModJar') {
    dependsOn tasks.named('jar')
    doLast {
        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(artifact)
        try {
            ['META-INF/neoforge.mods.toml', 'ftb_quest_nexus.ftb_quests.mixins.json',
             'com/dishanhai/ftb_quest_nexus/QuestNexus.class',
             'data/ftb_quest_nexus/loot_table/blocks/ftbq_ae_submitter.json',
             'data/ftb_quest_nexus/recipe/ftbq_ae_submitter.json'].each {
                if (zip.getEntry(it) == null) throw new GradleException("Missing mod entry: ${it}")
            }
            def forbidden = zip.entries().findAll {
                it.name.startsWith('META-INF/jarjar/') || it.name == 'META-INF/mods.toml' ||
                it.name.startsWith('kotlin/') || it.name.startsWith('kotlinx/') || it.name.startsWith('thedarkcolour/') ||
                it.name.startsWith('com/dishanhai/sh_better_ui/') ||
                it.name.startsWith('assets/sh_better_ui/') || it.name.startsWith('appeng/') ||
                it.name.startsWith('dev/ftb/') || it.name.startsWith('mekanism/') ||
                it.name.startsWith('me/ramidzkh/mekae2/') || it.name.contains('GameTests') || it.name.startsWith('data/ftb_quest_nexus/test_instance/')
            }.collect { it.name }
            if (!forbidden.isEmpty()) throw new GradleException("Unexpected mod entries: ${forbidden.take(5)}")
        } finally { zip.close() }
    }
}
tasks.named('build') { dependsOn tasks.named('verifyModJar') }

tasks.named('wrapper') { gradleVersion = '9.2.1'; distributionType = Wrapper.DistributionType.BIN }
